<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>みんなの席替え大会</title><style>body{font-family:system-ui,sans-serif;background:#f3f6fa;color:#203044;margin:0}header{background:#183a63;color:white;padding:18px 24px}h1{margin:0;font-size:1.5rem}main{max-width:1050px;margin:auto;padding:18px}.panel{background:white;border-radius:14px;padding:18px;margin:14px 0;box-shadow:0 2px 12px #16304a12}button,input,select,textarea{font:inherit;padding:9px;border:1px solid #a9b8c8;border-radius:8px}button{background:#e8f0fa;cursor:pointer}button.primary{background:#1763ae;color:white;border:0}button:focus-visible{outline:3px solid orange}.toolbar{display:flex;gap:9px;flex-wrap:wrap;align-items:center}.room{overflow:auto;padding:12px}.board{text-align:center;border:2px solid #6e8299;padding:9px;margin:0 auto 20px;max-width:360px}.seats{display:grid;grid-template-columns:repeat(6,minmax(80px,1fr));gap:9px;min-width:530px}.seat{min-height:55px;background:#e8f2ff;border:2px solid #93b8dd;border-radius:10px;display:flex;align-items:center;justify-content:center;text-align:center;font-weight:600}.seat.empty{background:transparent;border:2px dashed #d4dbe4}.seat small{display:block;font-weight:400}textarea{width:100%;box-sizing:border-box;min-height:120px}label{display:inline-flex;gap:5px;align-items:center}#status{min-height:24px;color:#175d39}.muted{color:#657486;font-size:.9rem}#historyList button{margin:3px} @media print{header,.controls,.muted,#status,#historyPanel{display:none!important}body{background:white}main{padding:0}.panel{box-shadow:none;margin:0}.seats{min-width:0;gap:5px}.seat{break-inside:avoid;font-size:11pt} @page{size:A4 landscape;margin:12mm}}</style></head><body><header><h1>🎉 みんなの席替え大会</h1><div>基本機能お試し版 Ver.0.1</div></header><main><section class="panel controls"><div class="toolbar"><label>クラス <select id="classes"></select></label><button id="addClass">＋ クラス追加</button><button id="renameClass">名前変更</button><button id="deleteClass">削除</button></div><p class="muted">データはこのブラウザ内に保存します。実際の生徒名を入力する前に学校の個人情報管理方針をご確認ください。</p></section><section class="panel controls"><h2>① 名簿を準備</h2><p>1行に1人ずつ「出席番号,名前」の順に入力します。名前を省略して番号だけでも使えます。</p><textarea id="roster" aria-label="名簿"></textarea><div class="toolbar"><button id="saveRoster">名簿を保存</button><button id="demoRoster">40人の番号を設定</button></div></section><section class="panel"><div class="controls"><h2>② 席替えを実行</h2><div class="toolbar"><button class="primary" id="shuffle">席替えする</button><button id="saveResult" disabled>この結果を確定・保存</button><label>表示 <select id="display"><option value="number">番号</option><option value="name">名前</option></select></label><button onclick="window.print()">A4横で印刷</button></div><p id="status" role="status"></p></div><div class="room"><div class="board">黒板・教卓（前方）</div><div class="seats" id="seats"></div></div><p class="muted">教員から見た配置です。両端は6席、中央4列は7席です。</p></section><section class="panel controls" id="historyPanel"><h2>③ 過去の席替え</h2><div id="historyList"></div><div class="toolbar"><button id="export">バックアップを書き出す（JSON）</button><label>バックアップを読み込む <input type="file" id="import" accept=".json,application/json"></label></div></section></main><script>
const key='minna-sekigae-v01';const makeSeats=()=>{let a=[];for(let c=0;c<6;c++)for(let r=0;r<(c===0||c===5?6:7);r++)a.push({id:`${c}-${r}`,c,r});return a};const positions=makeSeats();const fresh=()=>({id:crypto.randomUUID(),name:'3年6組',roster:Array.from({length:40},(_,i)=>({number:i+1,name:''})),assignment:[],history:[]});let data;try{data=JSON.parse(localStorage.getItem(key))}catch{}if(!data||!Array.isArray(data.classes)||!data.classes.length)data={classes:[fresh()],active:null};if(!data.active)data.active=data.classes[0].id;let preview=null;const $=id=>document.getElementById(id);const current=()=>data.classes.find(x=>x.id===data.active)||data.classes[0];const save=()=>localStorage.setItem(key,JSON.stringify(data));const message=s=>$('status').textContent=s;function render(){const cl=current();$('classes').replaceChildren(...data.classes.map(c=>{const o=document.createElement('option');o.value=c.id;o.textContent=c.name;o.selected=c.id===cl.id;return o}));$('roster').value=cl.roster.map(s=>`${s.number},${s.name}`).join('\n');$('saveResult').disabled=!preview;draw();history()}function draw(){const cl=current(),assigned=preview||cl.assignment,lookup=new Map(cl.roster.map(s=>[s.number,s]));$('seats').replaceChildren();for(let r=0;r<7;r++)for(let c=0;c<6;c++){const pos=positions.find(p=>p.c===c&&p.r===r),el=document.createElement('div');el.className='seat'+(!pos?' empty':'');if(pos){const n=assigned[positions.findIndex(p=>p.id===pos.id)];if(n!==undefined){const student=lookup.get(n);el.textContent=$('display').value==='name'&&student?.name?student.name:String(n)}else el.textContent='—'}$('seats').append(el)}}function history(){const cl=current();$('historyList').replaceChildren();if(!cl.history.length){$('historyList').textContent='まだ履歴はありません。';return}cl.history.slice().reverse().forEach(h=>{const row=document.createElement('div'),b=document.createElement('button');b.textContent=`${new Date(h.date).toLocaleString('ja-JP')} の配置を表示`;b.onclick=()=>{preview=h.assignment.slice();$('saveResult').disabled=false;draw();message('履歴を表示中です。保存すると新しい履歴になります。')};row.append(b);$('historyList').append(row)})}function rosterParse(s){const lines=s.split(/\r?\n/).map(x=>x.trim()).filter(Boolean);const list=lines.map((line,i)=>{const parts=line.split(',');const number=Number(parts[0]);if(!Number.isSafeInteger(number)||number<1||parts.length>2)throw Error(`${i+1}行目の形式を確認してください。`);return {number,name:(parts[1]||'').trim()}});if(new Set(list.map(x=>x.number)).size!==list.length)throw Error('出席番号が重複しています。');if(!list.length)throw Error('名簿が空です。');return list}function changeRoster(){try{const list=rosterParse($('roster').value);if(!confirm('名簿を保存します。現在の座席結果はリセットされます。よろしいですか？'))return;current().roster=list;current().assignment=[];preview=null;save();render();message(`${list.length}人を登録しました。`)}catch(e){alert(e.message)}}$('saveRoster').onclick=changeRoster;$('demoRoster').onclick=()=>{$('roster').value=Array.from({length:40},(_,i)=>`${i+1},`).join('\n');message('40人分の番号を入力しました。「名簿を保存」を押してください。')};$('shuffle').onclick=()=>{const cl=current();if(cl.roster.length!==positions.length){message(`現在の座席は40席です。名簿は${cl.roster.length}人のため抽選できません。`);return}const arr=cl.roster.map(x=>x.number);for(let i=arr.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]]}preview=arr;$('saveResult').disabled=false;draw();message('仮の抽選結果です。気に入ったら「この結果を確定・保存」を押してください。')};$('saveResult').onclick=()=>{if(!preview)return;const cl=current();cl.assignment=preview.slice();cl.history.push({id:crypto.randomUUID(),date:new Date().toISOString(),assignment:preview.slice()});preview=null;save();render();message('席替え結果を保存しました。')};$('display').onchange=draw;$('classes').onchange=e=>{data.active=e.target.value;preview=null;save();render();message('クラスを切り替えました。')};$('addClass').onclick=()=>{const name=prompt('新しいクラス名を入力してください');if(!name?.trim())return;const cl=fresh();cl.name=name.trim();data.classes.push(cl);data.active=cl.id;preview=null;save();render()};$('renameClass').onclick=()=>{const name=prompt('クラス名',current().name);if(!name?.trim())return;current().name=name.trim();save();render()};$('deleteClass').onclick=()=>{if(data.classes.length===1)return alert('最後のクラスは削除できません。');if(!confirm(`${current().name}と履歴をすべて削除しますか？`))return;data.classes=data.classes.filter(c=>c.id!==data.active);data.active=data.classes[0].id;preview=null;save();render()};$('export').onclick=()=>{const blob=new Blob([JSON.stringify({version:1,...data},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='sekigae-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};$('import').onchange=async e=>{const file=e.target.files[0];if(!file)return;try{const parsed=JSON.parse(await file.text());if(parsed.version!==1||!Array.isArray(parsed.classes)||!parsed.classes.length||!parsed.classes.every(c=>typeof c.id==='string'&&typeof c.name==='string'&&Array.isArray(c.roster)&&Array.isArray(c.history)&&Array.isArray(c.assignment)))throw Error('対応していないバックアップ形式です。');if(!confirm('現在の全クラスと履歴を上書きします。よろしいですか？'))return;data={classes:parsed.classes,active:parsed.classes.some(c=>c.id===parsed.active)?parsed.active:parsed.classes[0].id};preview=null;save();render();message('バックアップを復元しました。')}catch(err){alert(err.message)}finally{e.target.value=''}};render();
</script></body></html>
